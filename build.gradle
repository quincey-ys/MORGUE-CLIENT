buildscript {
    repositories {
        mavenCentral()
    }
    dependencies {
        classpath 'com.guardsquare:proguard-gradle:7.10.0'
    }
}

plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
    id 'maven-publish'
    id 'org.cyclonedx.bom' version '3.6.0'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    maven { url = "https://maven.fabricmc.net/" }
    mavenCentral()
}

loom {
    splitEnvironmentSourceSets()

    mods {
        "morgue" {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}

processResources {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

tasks.named("processClientResources") {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    options.release = 25
    options.encoding = "UTF-8"
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
    withSourcesJar()
}

// Minecraft 26.3 is distributed without the legacy mapping-remap task; obfuscate the Loom client JAR.
// Fabric's entrypoint class and callback are retained; internal implementation
// class/member names are obfuscated while package hierarchy is preserved.
def obfuscatedJar = layout.buildDirectory.file("obfuscated/${project.archives_base_name}-${project.version}.jar")
def obfuscationMap = layout.buildDirectory.file("reports/morgue/proguard-mapping.txt")

tasks.register('obfuscateClientJar', proguard.gradle.ProGuardTask) {
    dependsOn tasks.named('jar')

    injars(tasks.named('jar').get().archiveFile.get().asFile)
    outjars(obfuscatedJar.get().asFile)

    // JDK modules plus the compile classpath used by the client source set.
    fileTree("${System.getProperty('java.home')}/jmods").matching {
        include '*.jmod'
    }.files.each { jmod ->
        libraryjars("${jmod.absolutePath}(!**.jar;!module-info.class)")
    }
    libraryjars(sourceSets.client.compileClasspath)

    dontshrink()
    dontoptimize()
    // ProGuard preverification is enabled by default; do not disable it.
    // ProGuard may report unresolved optional references from platform libraries.
    // Keep these visible in verbose CI logs; no shrinking or optimization is done.
    verbose()
    ignorewarnings()
    // Keep package visibility and package-relative verifier frames stable.
    keepdirectories('**')
    keepattributes('Exceptions,InnerClasses,Signature,Deprecated,*Annotation*,EnclosingMethod,Record,NestMembers,NestHost,PermittedSubclasses,MethodParameters,StackMapTable')

    // Fabric loads this class by its name from fabric.mod.json.
    keep('public class dev.morgue.client.MorgueClient { public <init>(); public void onInitializeClient(); }')

    // Enum.valueOf(Class, String) checks the JVM ACC_ENUM flag. Keep enum
    // classes and their constants intact through name obfuscation.
    keep('enum dev.morgue.client.** { *; }')

    // Keep the verifier's diagnostic API names stable for the CI smoke test.
    keepclassmembernames('''class dev.morgue.client.security.MorgueIntegrity {
        public static void verify();
        public static java.lang.String getStatus();
        public static java.lang.String getDetails();
        public static boolean isActivationAllowed();
    }''')

    // Obfuscate class/member names but preserve the original package hierarchy.
    // Repackaging and access rewriting are unnecessary for this client and can
    // make verifier failures harder to isolate on newer JVM class-file versions.
    adaptresourcefilecontents('fabric.mod.json')
    doFirst { obfuscationMap.get().asFile.parentFile.mkdirs() }
    printmapping(obfuscationMap.get().asFile)
}



// Verify every class in the obfuscated JAR with the target JVM verifier before
// the protected release is packaged. The test class is deliberately compiled
// separately and loads the JAR in an isolated class loader with the compile
// dependencies available, without running any client static initializers.
tasks.register('compileProtectedBytecodeSmokeTest', JavaCompile) {
    source = files('tools/ProtectedBytecodeSmokeTest.java')
    classpath = files()
    destinationDirectory = layout.buildDirectory.dir('verification-runner')
    javaCompiler = javaToolchains.compilerFor {
        languageVersion = JavaLanguageVersion.of(25)
    }
    options.release = 25
    options.encoding = 'UTF-8'
}

tasks.register('verifyProtectedBytecode', JavaExec) {
    dependsOn tasks.named('compileProtectedBytecodeSmokeTest'), tasks.named('obfuscateClientJar')
    inputs.file(obfuscatedJar)
    inputs.files(sourceSets.client.compileClasspath)
    classpath = files(layout.buildDirectory.dir('verification-runner'))
    mainClass = 'ProtectedBytecodeSmokeTest'
    javaLauncher = javaToolchains.launcherFor {
        languageVersion = JavaLanguageVersion.of(25)
    }
    jvmArgs '-Xverify:all'
    args obfuscatedJar.get().asFile.absolutePath, sourceSets.client.compileClasspath.asPath
}

// Add embedded hashes after obfuscation. All regular JAR entries except this
// manifest are hashed so the runtime can detect changed, missing, or extra files.
tasks.register('packageProtectedRelease') {
    dependsOn tasks.named('obfuscateClientJar'), tasks.named('verifyProtectedBytecode'), tasks.named('cyclonedxBom')

    doLast {
        def inputJar = obfuscatedJar.get().asFile
        if (!inputJar.isFile()) {
            throw new GradleException("Obfuscated JAR was not produced: ${inputJar}")
        }

        def releaseDir = layout.buildDirectory.dir('release').get().asFile
        releaseDir.mkdirs()
        def releaseName = "${project.archives_base_name}-${project.version}.jar"
        def releaseJar = new File(releaseDir, releaseName)
        def tempJar = new File(releaseDir, releaseName + ".tmp")
        def integrityEntryName = 'META-INF/morgue-integrity.sha256'
        def entryHashes = new TreeMap<String, String>()

        new java.util.jar.JarFile(inputJar).withCloseable { archive ->
            def entries = archive.entries()
            while (entries.hasMoreElements()) {
                def entry = entries.nextElement()
                if (entry.isDirectory() || entry.name == integrityEntryName) {
                    continue
                }
                def digest = java.security.MessageDigest.getInstance('SHA-256')
                archive.getInputStream(entry).withCloseable { stream ->
                    stream.transferTo(new java.security.DigestOutputStream(
                            java.io.OutputStream.nullOutputStream(), digest))
                }
                if (entryHashes.put(entry.name, java.util.HexFormat.of().formatHex(digest.digest())) != null) {
                    throw new GradleException("Duplicate JAR entry detected: ${entry.name}")
                }
            }
        }

        new java.util.jar.JarFile(inputJar).withCloseable { archive ->
            new java.util.jar.JarOutputStream(
                    new java.io.BufferedOutputStream(new java.io.FileOutputStream(tempJar))
            ).withCloseable { output ->
                def entries = archive.entries()
                while (entries.hasMoreElements()) {
                    def sourceEntry = entries.nextElement()
                    if (sourceEntry.name == integrityEntryName) {
                        continue
                    }
                    def destinationEntry = new java.util.jar.JarEntry(sourceEntry.name)
                    if (sourceEntry.time >= 0) {
                        destinationEntry.setTime(sourceEntry.time)
                    }
                    output.putNextEntry(destinationEntry)
                    if (!sourceEntry.isDirectory()) {
                        archive.getInputStream(sourceEntry).withCloseable { stream ->
                            stream.transferTo(output)
                        }
                    }
                    output.closeEntry()
                }

                def integrityEntry = new java.util.jar.JarEntry(integrityEntryName)
                output.putNextEntry(integrityEntry)
                def manifestText = entryHashes.collect { name, hash -> "${hash}  ${name}" }.join("\n") + "\n"
                output.write(manifestText.getBytes(java.nio.charset.StandardCharsets.UTF_8))
                output.closeEntry()
            }
        }

        java.nio.file.Files.move(tempJar.toPath(), releaseJar.toPath(),
                java.nio.file.StandardCopyOption.REPLACE_EXISTING)

        def releaseDigest = java.security.MessageDigest.getInstance('SHA-256')
        java.nio.file.Files.newInputStream(releaseJar.toPath()).withCloseable { stream ->
            stream.transferTo(new java.security.DigestOutputStream(
                    java.io.OutputStream.nullOutputStream(), releaseDigest))
        }
        def releaseHash = java.util.HexFormat.of().formatHex(releaseDigest.digest())
        new File(releaseDir, releaseName + '.sha256').text =
                "${releaseHash}  ${releaseName}\n"

        new File(releaseDir, 'BUILD-INFO.txt').text = [
                "mod_version=${project.version}",
                "minecraft=${project.minecraft_version}",
                "java=${System.getProperty('java.version')}",
                "commit=${System.getenv('GITHUB_SHA') ?: 'local'}",
                "workflow_run=${System.getenv('GITHUB_RUN_ID') ?: 'local'}",
                "obfuscator=ProGuard 7.10.0",
                "integrity=embedded SHA-256 entry manifest"
        ].join("\n") + "\n"

        def bomJson = file("${buildDir}/reports/cyclonedx/bom.json")
        def bomXml = file("${buildDir}/reports/cyclonedx/bom.xml")
        if (bomJson.isFile()) {
            java.nio.file.Files.copy(bomJson.toPath(),
                    new File(releaseDir, 'sbom.cyclonedx.json').toPath(),
                    java.nio.file.StandardCopyOption.REPLACE_EXISTING)
        }
        if (bomXml.isFile()) {
            java.nio.file.Files.copy(bomXml.toPath(),
                    new File(releaseDir, 'sbom.cyclonedx.xml').toPath(),
                    java.nio.file.StandardCopyOption.REPLACE_EXISTING)
        }

        if (!new File(releaseDir, 'sbom.cyclonedx.json').isFile()) {
            throw new GradleException('CycloneDX JSON SBOM was not generated.')
        }
        logger.lifecycle("Protected MORGUE release packaged at ${releaseJar}")
    }
}

tasks.named('build') {
    finalizedBy tasks.named('packageProtectedRelease')
}
