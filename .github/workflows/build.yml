name: Build

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  attestations: write
  artifact-metadata: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.8.0'
      - name: Install FFmpeg for MP3-to-OGG resource conversion
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg
      - name: Build protected mod and SBOM
        run: gradle build --stacktrace
      - name: Verify protected release package
        shell: bash
        run: |
          set -euo pipefail
          jar_file="$(find build/release -maxdepth 1 -type f -name '*.jar' -print -quit)"
          test -n "$jar_file"
          test -s "$jar_file.sha256"
          sha_file="$(basename "$jar_file").sha256"
          (cd build/release && sha256sum -c "$sha_file")
          unzip -t "$jar_file"
          jar tf "$jar_file" > build/release/jar-contents.txt
          verify_dir="$(mktemp -d)"
          trap 'rm -rf "$verify_dir"' EXIT
          unzip -q "$jar_file" -d "$verify_dir"
          test -s "$verify_dir/META-INF/morgue-integrity.sha256"
          (cd "$verify_dir" && sha256sum -c META-INF/morgue-integrity.sha256)
          grep -Fxq 'fabric.mod.json' build/release/jar-contents.txt
          grep -Fxq 'dev/morgue/client/MorgueClient.class' build/release/jar-contents.txt
          grep -Fxq 'assets/morgue/sounds.json' build/release/jar-contents.txt
          for effect in open close hover click toggle_on toggle_off slider kill; do
            grep -Fxq "assets/morgue/sounds/ui/${effect}.ogg" build/release/jar-contents.txt
          done
          if grep -Eq '^assets/.+\.mp3$' build/release/jar-contents.txt; then
            echo "Source MP3 files must not be included in the release JAR."
            exit 1
          fi
          grep -Fxq 'META-INF/morgue-integrity.sha256' build/release/jar-contents.txt
          mod_version="$(sed -n 's/^mod_version=//p' gradle.properties)"
          unzip -p "$jar_file" fabric.mod.json | grep -Fq "\"version\": \"$mod_version\""
          if unzip -p "$jar_file" fabric.mod.json | grep -Fq '${version}'; then
            echo "fabric.mod.json still contains an unresolved version placeholder."
            exit 1
          fi
          grep -Eq '^morgue/internal/[^/]+\.class$' build/release/jar-contents.txt
          test -s build/release/sbom.cyclonedx.json
          test -s build/release/BYTECODE-VERIFICATION.txt
          grep -Fq 'JVM verification: -Xverify:all' build/release/BYTECODE-VERIFICATION.txt
          javac --release 25 -d "$RUNNER_TEMP/morgue-integrity-smoke" tools/IntegritySmokeTest.java
          java -cp "$RUNNER_TEMP/morgue-integrity-smoke" IntegritySmokeTest "$jar_file" VERIFIED true
          javac --release 25 -d "$RUNNER_TEMP/morgue-enum-smoke" tools/EnumSmokeTest.java
          java -cp "$RUNNER_TEMP/morgue-enum-smoke" EnumSmokeTest "$jar_file"
          tampered_jar="$RUNNER_TEMP/Morgue-Refined-tampered.jar"
          cp "$jar_file" "$tampered_jar"
          printf 'intentional test modification\n' > "$RUNNER_TEMP/morgue-integrity-tamper.txt"
          jar --update --file "$tampered_jar" -C "$RUNNER_TEMP" morgue-integrity-tamper.txt
          java -cp "$RUNNER_TEMP/morgue-integrity-smoke" IntegritySmokeTest "$tampered_jar" FAILED false
          echo "Protected release, enum runtime, metadata, integrity, tamper rejection, and SBOM verified."
      - name: Generate build provenance for public repositories
        if: ${{ github.event.repository.private == false }}
        uses: actions/attest@v4
        with:
          subject-path: 'build/release/*.jar'
      - name: Upload protected release
        uses: actions/upload-artifact@v7
        with:
          name: Morgue-Refined
          path: build/release/*
 build/release/jar-contents.txt; then
            echo "Source MP3 files must not be included in the release JAR."
            exit 1
          fi
          grep -Fxq 'META-INF/morgue-integrity.sha256' build/release/jar-contents.txt
          mod_version="$(sed -n 's/^mod_version=//p' gradle.properties)"
          unzip -p "$jar_file" fabric.mod.json | grep -Fq "\"version\": \"$mod_version\""
          if unzip -p "$jar_file" fabric.mod.json | grep -Fq '${version}'; then
            echo "fabric.mod.json still contains an unresolved version placeholder."
            exit 1
          fi
          grep -Eq '^morgue/internal/[^/]+\.class$' build/release/jar-contents.txt
          test -s build/release/sbom.cyclonedx.json
          test -s build/release/BYTECODE-VERIFICATION.txt
          grep -Fq 'JVM verification: -Xverify:all' build/release/BYTECODE-VERIFICATION.txt
          javac --release 25 -d "$RUNNER_TEMP/morgue-integrity-smoke" tools/IntegritySmokeTest.java
          java -cp "$RUNNER_TEMP/morgue-integrity-smoke" IntegritySmokeTest "$jar_file" VERIFIED true
          javac --release 25 -d "$RUNNER_TEMP/morgue-enum-smoke" tools/EnumSmokeTest.java
          java -cp "$RUNNER_TEMP/morgue-enum-smoke" EnumSmokeTest "$jar_file"
          tampered_jar="$RUNNER_TEMP/Morgue-Refined-tampered.jar"
          cp "$jar_file" "$tampered_jar"
          printf 'intentional test modification\n' > "$RUNNER_TEMP/morgue-integrity-tamper.txt"
          jar --update --file "$tampered_jar" -C "$RUNNER_TEMP" morgue-integrity-tamper.txt
          java -cp "$RUNNER_TEMP/morgue-integrity-smoke" IntegritySmokeTest "$tampered_jar" FAILED false
          echo "Protected release, enum runtime, metadata, integrity, tamper rejection, and SBOM verified."
      - name: Generate build provenance for public repositories
        if: ${{ github.event.repository.private == false }}
        uses: actions/attest@v4
        with:
          subject-path: 'build/release/*.jar'
      - name: Upload protected release
        uses: actions/upload-artifact@v7
        with:
          name: Morgue-Refined
          path: build/release/*
