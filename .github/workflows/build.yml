name: Build

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.8.0'
      - name: Build mod
        run: gradle build
      - name: Generate release integrity files
        shell: bash
        run: |
          set -euo pipefail
          for jar in build/libs/*.jar; do
            sha256sum "$jar" > "$jar.sha256"
          done
          {
            echo "commit=$GITHUB_SHA"
            echo "workflow_run=$GITHUB_RUN_ID"
            echo "java=25"
          } > build/libs/BUILD-INFO.txt
      - name: Upload JAR and integrity files
        uses: actions/upload-artifact@v4
        with:
          name: MORGUE-CLIENT
          path: |
            build/libs/*.jar
            build/libs/*.jar.sha256
            build/libs/BUILD-INFO.txt
